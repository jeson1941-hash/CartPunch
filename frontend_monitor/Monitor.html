        /* Custom Scanner & Floating Animations */
        @keyframes scan {
            0% { top: 10%; opacity: 0; }
            10% { opacity: 1; }
            90% { opacity: 1; }
            100% { top: 90%; opacity: 0; }

        @keyframes floatUp {

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;

        // --- GROCERY CATEGORIES & KEYWORD MAPPER ---
        const CATEGORIES = [
            'Canned Goods & Condiments',
            'Instant Noodles',
            'Beverages',
            'Snacks & Chips',
            'Biscuits & Cookies',
            'Dairy & Coffee',
            'Candies & Sweets'
        ];

        // Automatic categorization helper for Firebase products
        const categorizeProduct = (productName, existingCategory) => {
            if (existingCategory && CATEGORIES.includes(existingCategory)) {
                return existingCategory;
            }
            const lower = (productName || '').toLowerCase();
            if (lower.includes('canned') || lower.includes('sauce') || lower.includes('sardine') || lower.includes('tuna') || lower.includes('corned') || lower.includes('spam') || lower.includes('condiment') || lower.includes('vinegar') || lower.includes('soy') || lower.includes('oil') || lower.includes('dip') || lower.includes('ketchup') || lower.includes('mayo')) {
                return 'Canned Goods & Condiments';
            }
            if (lower.includes('noodle') || lower.includes('ramen') || lower.includes('pancit') || lower.includes('canton') || lower.includes('pasta') || lower.includes('spaghetti') || lower.includes('mami') || lower.includes('soup')) {
                return 'Instant Noodles';
            }
            if (lower.includes('drink') || lower.includes('juice') || lower.includes('water') || lower.includes('soda') || lower.includes('cola') || lower.includes('tea') || lower.includes('beverage') || lower.includes('beer')) {
                return 'Beverages';
            }
            if (lower.includes('chip') || lower.includes('snack') || lower.includes('crisp') || lower.includes('popcorn') || lower.includes('pretzel') || lower.includes('piattos') || lower.includes('nova') || lower.includes('chippy') || lower.includes('cornick')) {
                return 'Snacks & Chips';
            }
            if (lower.includes('biscuit') || lower.includes('cookie') || lower.includes('cracker') || lower.includes('wafer') || lower.includes('fita') || lower.includes('skyflakes') || lower.includes('oreo')) {
                return 'Biscuits & Cookies';
            }
            if (lower.includes('coffee') || lower.includes('milk') || lower.includes('dairy') || lower.includes('cheese') || lower.includes('creamer') || lower.includes('butter') || lower.includes('nescafe') || lower.includes('great taste') || lower.includes('latte') || lower.includes('folgers')) {
                return 'Dairy & Coffee';
            }
            if (lower.includes('candy') || lower.includes('sweet') || lower.includes('chocolate') || lower.includes('gummy') || lower.includes('lollipop') || lower.includes('caramel')) {
                return 'Candies & Sweets';
            }
            return 'Snacks & Chips'; // Sensible default fallback
        };

        // Format numeric strings with comma separators
        const formatNumberWithCommas = (str) => {
            if (str === undefined || str === null || str === '') return '0';
            const parts = str.toString().split('.');
            parts[0] = parts[0].replace(/\B(?=(\d{3})+(?!\d))/g, ",");
            return parts.join('.');
        };

        // --- SELF-CONTAINED SVG ICONS ---

        const ScanLine = (props) => (

        const X = (props) => (

            </IconWrapper>
        );

        const ShieldCheck = (props) => (
            <IconWrapper {...props}>
                <path d="M20 13c0 5-3.5 7.5-7.66 8.95a1 1 0 0 1-.67-.01C7.5 20.5 4 18 4 13V6a1 1 0 0 1 1-1c2 0 4.5-1.2 6.24-2.72a1.17 1.17 0 0 1 1.52 0C14.51 3.81 17 5 19 5a1 1 0 0 1 1 1z" />
                <path d="m9 12 2 2 4-4" />
            </IconWrapper>
        );

        const Layers = (props) => (
            <IconWrapper {...props}>
                <polygon points="12 2 2 7 12 12 22 7 12 2" />
                <polyline points="2 17 12 22 22 17" />
                <polyline points="2 12 12 17 22 12" />

        const Search = (props) => (
            <IconWrapper {...props}>
                <circle cx="11" cy="11" r="8" />
                <path d="m21 21-4.3-4.3" />
            </IconWrapper>
        );

        // Sideways Battery Icon
        const SidewaysBattery = () => (
            <div className="flex items-center" title="Battery Status">
                <div className="w-6 h-3 rounded-[3px] border-[1.5px] border-gray-600 p-[1.5px] flex items-center bg-white">
                    <div className="h-full w-4/5 bg-emerald-500 rounded-[1px]"></div>
                </div>
                <div className="w-[2px] h-1.5 bg-gray-600 rounded-r-[1px] ml-[1px]"></div>
            </div>
        );

        function App() {
            // --- LIVE FIREBASE DATABASE PRODUCTS ---
            const [products, setProducts] = useState([]);

            // --- NAVIGATION & CORE STATE ---
            const [screen, setScreen] = useState('splash1');
            const [budgetMode, setBudgetMode] = useState('none'); // 'none' | 'single' | 'category'
            const [budget, setBudget] = useState(0);
            const [budgetInputStr, setBudgetInputStr] = useState('');

            // Category Allocation State
            const [allocations, setAllocations] = useState([]); // [{ id, category, amount }]
            const [pendingCategory, setPendingCategory] = useState(CATEGORIES[0]);
            const [isAllocKeypadOpen, setIsAllocKeypadOpen] = useState(false);
            const [allocAmountStr, setAllocAmountStr] = useState('');
            const [allocLimitNotice, setAllocLimitNotice] = useState('');
            const [selectedCatInfo, setSelectedCatInfo] = useState(null);

            // Cart & Scanning State
            const [cart, setCart] = useState([]);
            const [scannedItem, setScannedItem] = useState(null);
            const [itemQty, setItemQty] = useState(1);
            const [manualInputType, setManualInputType] = useState('barcode'); // 'barcode' | 'name'
            const [manualInputValue, setManualInputValue] = useState('');
            const [searchResults, setSearchResults] = useState([]);
            const [isKeyboardVisible, setIsKeyboardVisible] = useState(true);
            const [isOnline, setIsOnline] = useState(true);
            const [scanNotice, setScanNotice] = useState('');

            // Popups & Alerts
            const [hasShown70Warning, setHasShown70Warning] = useState(false);
            const [shownCategoryWarnings, setShownCategoryWarnings] = useState({});
            const [popupAlert, setPopupAlert] = useState(null); // null | 'warning70' | 'limit'
            const [alertMessage, setAlertMessage] = useState('');
            const [returnScreen, setReturnScreen] = useState(null);
            const [scanOrigin, setScanOrigin] = useState('scanning');

            // Quantity Keypad Overlay State
            const [isQtyPadVisible, setIsQtyPadVisible] = useState(false);
            const [qtyInputStr, setQtyInputStr] = useState('1');
            const [editingCartItemId, setEditingCartItemId] = useState(null);

            // Thank You 10-second countdown
            const [thankYouSeconds, setThankYouSeconds] = useState(10);

            // Barcode hardware scanner buffer
            const scanBufferRef = useRef('');
            const scanTimerRef = useRef(null);

            // --- SYNC LIVE PRODUCTS FROM FIREBASE REALTIME DATABASE ---
            useEffect(() => {
                const productsRef = db.ref('products');
                productsRef.on('value', (snapshot) => {
                    const data = snapshot.val();
                    const loaded = [];
                    if (data) {
                        Object.keys(data).forEach(key => {
                            const raw = data[key];
                            const itemName = raw.name || raw.item_description || raw.description || 'Unknown Item';
                            const itemPrice = parseFloat(raw.price !== undefined ? raw.price : raw.unit_price) || 0;
                            const itemStock = raw.stock || 'High Stock';
                            const cat = raw.category || categorizeProduct(itemName);
                            loaded.push({
                                id: String(raw.sku || key),
                                name: itemName,
                                price: itemPrice,
                                stock: itemStock,
                                category: cat
                            });
                        });
                    }
                    setProducts(loaded);
                    setIsOnline(true);
                }, (error) => {
                    console.error("Firebase connection error:", error);
                    setIsOnline(false);
                });

                return () => productsRef.off();
            }, []);

            // --- DERIVED CALCULATIONS ---
            const allocatedTotal = allocations.reduce((sum, row) => sum + row.amount, 0);
            const effectiveBudget = budgetMode === 'category' ? allocatedTotal : (budgetMode === 'single' ? budget : 0);
            const cartTotal = cart.reduce((sum, item) => sum + (item.price * item.qty), 0);

            // Aggregate category budgets & spending
            const getCategorySummaries = () => {
                const map = {};
                allocations.forEach(row => {
                    if (!map[row.category]) {
                        map[row.category] = { category: row.category, allocated: 0, spent: 0 };
                    }
                    map[row.category].allocated += row.amount;
                });
                cart.forEach(item => {
                    const itemCat = item.category || categorizeProduct(item.name);
                    if (map[itemCat]) {
                        map[itemCat].spent += item.price * item.qty;
                    }
                });
                return Object.values(map);
            };

            const categorySummaries = getCategorySummaries();

            // --- AUTOMATIC BARCODE SCANNER LISTENER ON HOME SCREEN ---
            useEffect(() => {
                if (screen !== 'scanning' || popupAlert || isQtyPadVisible) return;

                const handleKeyDown = (e) => {
                    if (e.key === 'Enter') {
                        const code = scanBufferRef.current.trim();
                        scanBufferRef.current = '';
                        if (code.length >= 4) {
                            const found = products.find(i => i.id === code);
                            if (found) {
                                triggerItemScanned(found, 'scanning');
                            } else {
                                setScanNotice(`Barcode "${code}" not found in system.`);
                            }
                        }
                        return;
                    }
                    if (e.key.length === 1) {
                        scanBufferRef.current += e.key;
                        clearTimeout(scanTimerRef.current);
                        scanTimerRef.current = setTimeout(() => {
                            scanBufferRef.current = '';
                        }, 300);
                    }
                };

                window.addEventListener('keydown', handleKeyDown);
                return () => window.removeEventListener('keydown', handleKeyDown);
            }, [screen, popupAlert, isQtyPadVisible, products]);

            // Auto-clear scanner notice after 3 seconds
            useEffect(() => {
                if (!scanNotice) return;
                const timer = setTimeout(() => setScanNotice(''), 3000);
                return () => clearTimeout(timer);
            }, [scanNotice]);

            // --- THANK YOU 10-SECOND COUNTDOWN & AUTO-RESET ---
            useEffect(() => {
                if (screen !== 'thank_you') return;
                setThankYouSeconds(10);

                const interval = setInterval(() => {
                    setThankYouSeconds(prev => {
                        if (prev <= 1) {
                            clearInterval(interval);
                            resetApp();
                            return 0;
                        }
                        return prev - 1;
                    });
                }, 1000);

                return () => clearInterval(interval);
            }, [screen]);

            // --- MANUAL SEARCH FILTER ---
            useEffect(() => {
                if (!manualInputValue.trim()) {
                    setSearchResults([]);
                    return;
                }
                const lower = manualInputValue.toLowerCase();
                const filtered = products.filter(item =>
                    manualInputType === 'barcode'
                        ? item.id.includes(lower)
                        : item.name.toLowerCase().includes(lower)
                );
                setSearchResults(filtered);
            }, [manualInputValue, manualInputType, products]);

            // --- THEME ENGINE ---
            const defaultTheme = {
                bg: 'bg-[#FFF9F5]',
                primary: 'bg-orange-500',
                primaryHover: 'hover:bg-orange-600',
                textTitle: 'text-orange-950',
                textValue: 'text-orange-600',
                iconBg: 'bg-orange-100',
                iconColor: 'text-orange-600',
                border: 'border-orange-100',
                borderHighlight: 'border-orange-200',
                shadow: 'shadow-orange-200',
                softBg: 'bg-orange-50',
                laserBg: 'bg-orange-500',
                laserShadow: 'shadow-[0_0_20px_#f97316]',
                hoverBorder: 'hover:border-orange-500',
                hoverText: 'group-hover:text-orange-500'
            };

            const getThemeColors = () => {
                const pct = (budgetMode !== 'none' && effectiveBudget > 0) ? (cartTotal / effectiveBudget) : 0;
                if (pct >= 0.9) {
                    return {
                        bg: 'bg-red-50',
                        primary: 'bg-red-500',
                        primaryHover: 'hover:bg-red-600',
                        textTitle: 'text-red-950',
                        textValue: 'text-red-600',
                        iconBg: 'bg-red-100',
                        iconColor: 'text-red-600',
                        border: 'border-red-100',
                        borderHighlight: 'border-red-200',
                        shadow: 'shadow-red-200',
                        softBg: 'bg-red-50',
                        laserBg: 'bg-red-500',
                        laserShadow: 'shadow-[0_0_20px_#ef4444]',
                        hoverBorder: 'hover:border-red-500',
                        hoverText: 'group-hover:text-red-500'
                    };
                }
                if (pct >= 0.7) {
                    return {
                        bg: 'bg-yellow-50',
                        primary: 'bg-yellow-500',
                        primaryHover: 'hover:bg-yellow-600',
                        textTitle: 'text-yellow-900',
                        textValue: 'text-yellow-700',
                        iconBg: 'bg-yellow-100',
                        iconColor: 'text-yellow-700',
                        border: 'border-yellow-200',
                        borderHighlight: 'border-yellow-300',
                        shadow: 'shadow-yellow-200',
                        softBg: 'bg-yellow-50',
                        laserBg: 'bg-yellow-400',
                        laserShadow: 'shadow-[0_0_20px_#facc15]',
                        hoverBorder: 'hover:border-yellow-500',
                        hoverText: 'group-hover:text-yellow-600'
                    };
                }
                return defaultTheme;
            };

            const theme = getThemeColors();

            // --- CORE ACTIONS ---
            const resetApp = () => {
                setCart([]);
                setBudgetMode('none');
                setBudget(0);
                setBudgetInputStr('');
                setAllocations([]);
                setPendingCategory(CATEGORIES[0]);
                setIsAllocKeypadOpen(false);
                setAllocAmountStr('');
                setAllocLimitNotice('');
                setSelectedCatInfo(null);
                setScannedItem(null);
                setItemQty(1);
                setManualInputValue('');
                setIsKeyboardVisible(true);
                setScanNotice('');
                setHasShown70Warning(false);
                setShownCategoryWarnings({});
                setPopupAlert(null);
                setAlertMessage('');
                setReturnScreen(null);
                setIsQtyPadVisible(false);
                setEditingCartItemId(null);
                setScreen('splash1');
            };

            const triggerItemScanned = (item, origin = 'scanning') => {
                if (!item) return;
                const withCat = {
                    ...item,
                    category: item.category || categorizeProduct(item.name)
                };
                setScannedItem(withCat);
                setItemQty(1);
                setScanOrigin(origin);
                setScreen('item_scanned');
            };

            const handleAutomaticDemoScan = () => {
                if (products.length === 0) {
                    setScanNotice('No items loaded from database yet.');
                    return;
                }
                const randomItem = products[Math.floor(Math.random() * products.length)];
                triggerItemScanned(randomItem, 'scanning');
            };

            const addToCartState = (item, qty) => {
                const existing = cart.find(i => i.id === item.id);
                if (existing) {
                    setCart(cart.map(i => i.id === item.id ? { ...i, qty: i.qty + qty } : i));
                } else {
                    setCart([...cart, { ...item, qty }]);
                }
            };

            const handleAddToCart = () => {
                if (!scannedItem) return;
                const newItemTotal = scannedItem.price * itemQty;
                const newCartTotal = cartTotal + newItemTotal;

                // Check overall budget limit if active
                if (budgetMode !== 'none' && effectiveBudget > 0 && newCartTotal > effectiveBudget) {
                    setPopupAlert('limit');
                    return;
                }

                addToCartState(scannedItem, itemQty);

                // Check 70% overall warning
                if (budgetMode !== 'none' && effectiveBudget > 0 && newCartTotal >= effectiveBudget * 0.7 && !hasShown70Warning) {
                    setHasShown70Warning(true);
                    setAlertMessage('You have reached 70% of your total budget. Spend wisely!');
                    setPopupAlert('warning70');
                    setScreen('scanning');
                    return;
                }

                // Check 70% category warning when in category allocation mode
                if (budgetMode === 'category') {
                    const catSummary = categorySummaries.find(c => c.category === scannedItem.category);
                    if (catSummary && catSummary.allocated > 0) {
                        const newCatSpent = catSummary.spent + newItemTotal;
                        const catPct = newCatSpent / catSummary.allocated;

            // =========================================================================

                                                const pctClamped = Math.min(100, Math.round(pct * 100));
                                                const remaining = catObj.allocated - catObj.spent;

                                                let rowStyle = 'bg-white/70 text-gray-900';
                                                let barColor = 'bg-emerald-500';
                                                let badgeText = `${pctClamped}%`;
                                                let badgeClass = 'bg-gray-100 text-gray-700';

                                                if (pct >= 0.9) {

                                                    barColor = 'bg-red-600';
                                                    badgeClass = 'bg-red-600 text-white';

                                                    rowStyle = 'animate-row-yellow text-gray-950';
                                                    barColor = 'bg-amber-500';
                                                    badgeClass = 'bg-amber-500 text-gray-950';
                                                }

                                                return (
                                                    <div
                                                        key={catObj.category}

                                                    >
                                                        <div className="flex items-center justify-between gap-2 mb-1.5">
                                                            <span className="font-extrabold text-sm text-gray-900 truncate">
                                                                {catObj.category}
                                                            </span>
                                                            <span className={`text-[11px] font-black px-2 py-0.5 rounded-full shrink-0 ${badgeClass}`}>
                                                                {badgeText}
                                                            </span>
                                                        </div>

                                                        <div className="flex items-baseline justify-between text-xs font-extrabold text-gray-900 mb-1.5">

                                                                ₱{formatNumberWithCommas(catObj.spent.toFixed(2))}{' '}

                                                                    / ₱{formatNumberWithCommas(catObj.allocated.toFixed(2))}
                                                                </span>
                                                            </span>
                                                            <span className={`text-[11px] font-extrabold ${remaining < 0 ? 'text-red-800' : 'text-gray-800'}`}>
                                                                {remaining < 0

                                                        </div>

                                                        <div className="w-full h-2 bg-black/10 rounded-full overflow-hidden">
                                                            <div

                                    >
                                        <div className={`absolute top-0 left-0 w-full h-1.5 ${theme.laserBg} opacity-80 ${theme.laserShadow} animate-scan-line`}></div>

                                            Waiting for the item to be scanned
                                        </p>
                                    </div>

                                    <button
                                        onClick={() => {
                                            setManualInputValue('');

                                onClick={() => setScreen('checkout')}

            // =========================================================================
            // SCREEN 6: MANUAL SEARCH
            // =========================================================================
            const renderManualInput = () => {
                const numericKeys = [
                    ['1', '2', '3'],
                    ['4', '5', '6'],
                    ['7', '8', '9'],
                    ['DEL', '0', 'ENTER']
                ];
                const qwertyRows = [
                    ['Q', 'W', 'E', 'R', 'T', 'Y', 'U', 'I', 'O', 'P'],
                    ['A', 'S', 'D', 'F', 'G', 'H', 'J', 'K', 'L'],
                    ['Z', 'X', 'C', 'V', 'B', 'N', 'M', 'DEL'],
                    ['SPACE', 'ENTER']
                ];

                const handleKeyPress = (key) => {
                    if (key === 'DEL') {
                        setManualInputValue(prev => prev.slice(0, -1));
                    } else if (key === 'SPACE') {
                        setManualInputValue(prev => prev + ' ');
                    } else if (key === 'ENTER') {
                        setIsKeyboardVisible(false);
                    } else {
                        setManualInputValue(prev => prev + key);
                    }
                };

                return (
                    <div className={`flex flex-col flex-1 min-h-0 ${defaultTheme.bg}`}>
                        <div className="px-5 pt-3 pb-2 flex items-center shrink-0">
                            <button
                                onClick={() => setScreen('scanning')}
                                className="p-2.5 bg-white rounded-full text-gray-600 shadow-xs border border-orange-100 mr-3"
                            >
                                <ArrowLeft size={20} />
                            </button>
                            <h2 className="text-xl font-bold text-gray-800">Manual Search</h2>
                        </div>

                        <div className="flex-1 flex flex-col pt-1 min-h-0 relative">
                            {/* Mode Toggle */}
                            <div className="px-5 mb-3 shrink-0">
                                <div className="flex bg-gray-100 p-1 rounded-xl border border-gray-200">
                                    <button
                                        onClick={() => { setManualInputType('barcode'); setManualInputValue(''); }}
                                        className={`flex-1 py-2.5 text-sm font-bold rounded-lg flex items-center justify-center space-x-2 transition-all ${
                                            manualInputType === 'barcode'
                                                ? 'bg-white shadow-xs text-orange-600 border border-orange-200'
                                                : 'text-gray-500'
                                        }`}
                                    >
                                        <ScanLine size={16} />
                                        <span>Barcode No.</span>
                                    </button>
                                    <button
                                        onClick={() => { setManualInputType('name'); setManualInputValue(''); }}
                                        className={`flex-1 py-2.5 text-sm font-bold rounded-lg flex items-center justify-center space-x-2 transition-all ${
                                            manualInputType === 'name'
                                                ? 'bg-white shadow-xs text-orange-600 border border-orange-200'
                                                : 'text-gray-500'
                                        }`}
                                    >
                                        <Type size={16} />
                                        <span>Product Name</span>
                                    </button>
                                </div>
                            </div>

                            <div className="px-5 flex-1 flex flex-col min-h-0">
                                <label className="block text-orange-600 text-xs font-bold uppercase tracking-wider mb-1.5 shrink-0">
                                    {manualInputType === 'barcode' ? 'Enter Barcode Numbers' : 'Enter Product Name'}
                                </label>

                                <div
                                    onClick={() => setIsKeyboardVisible(true)}
                                    className="relative shrink-0 mb-3 flex items-center justify-start text-left overflow-hidden rounded-2xl bg-white border-2 border-orange-200 focus-within:border-orange-500 shadow-inner pl-3 pr-4 py-3.5 cursor-text"
                                >
                                    <div className="flex items-center justify-start w-full overflow-hidden whitespace-nowrap">
                                        {manualInputValue ? (
                                            <>
                                                <span className="text-2xl font-bold text-gray-800 text-left">
                                                    {manualInputValue}
                                                </span>
                                                <div className="w-0.5 h-8 bg-orange-500 animate-pulse ml-0.5 shrink-0"></div>
                                            </>
                                        ) : (
                                            <>
                                                <div className="w-0.5 h-8 bg-orange-500 animate-pulse mr-1 shrink-0"></div>
                                                <span className="text-2xl font-bold text-gray-300 text-left">
                                                    {manualInputType === 'barcode' ? 'Enter barcode...' : 'Enter product name...'}
                                                </span>
                                            </>
                                        )}
                                    </div>
                                </div>

                                {manualInputValue.trim() !== '' && searchResults.length === 0 ? (
                                    <div className="bg-white/90 rounded-2xl border border-orange-100 p-4 text-center text-xs font-bold text-gray-400 mb-3">
                                        No matching items in the system.
                                    </div>
                                ) : (
                                    <div className={`overflow-y-auto bg-white rounded-2xl border-orange-200 shadow-xs transition-all flex flex-col ${
                                        searchResults.length > 0 ? 'border opacity-100 mb-3 flex-1' : 'border-none opacity-0 h-0 overflow-hidden'
                                    }`}>
                                        {searchResults.map((item) => (
                                            <button
                                                key={item.id}
                                                onClick={() => triggerItemScanned(item, 'manual_input')}
                                                className="w-full text-left p-3.5 border-b border-orange-50 hover:bg-orange-50/70 transition-colors flex justify-between items-center last:border-0 shrink-0"
                                            >
                                                <div className="flex-1 pr-3 min-w-0">
                                                    <p className="font-bold text-gray-800 text-xs truncate">{item.name}</p>
                                                    <p className="text-[11px] text-gray-400 font-mono mt-0.5 truncate">
                                                        {item.id} • {item.category}
                                                    </p>
                                                </div>
                                                <div className="bg-orange-100 border border-orange-200 px-2.5 py-1 rounded-xl shrink-0">
                                                    <p className="font-black text-orange-600 text-sm">
                                                        ₱{formatNumberWithCommas(item.price.toFixed(2))}
                                                    </p>
                                                </div>
                                            </button>
                                        ))}
                                    </div>
                                )}

                            {/* Collapsible Custom Keyboard */}
                            <div className="mt-auto shrink-0 flex flex-col relative z-20">
                                <div className="flex justify-end px-5 relative mb-[-1px] z-30">
                                    <button
                                        onClick={() => setIsKeyboardVisible(!isKeyboardVisible)}
                                        className="bg-gray-300 text-gray-700 px-5 py-1.5 rounded-t-xl flex items-center justify-center hover:bg-gray-400 transition-colors"
                                    >
                                        {isKeyboardVisible ? <ChevronDown size={20} /> : <ChevronUp size={20} />}
                                    </button>
                                </div>

                                <div className={`bg-gray-200/80 border-t border-gray-300 transition-all duration-300 overflow-hidden ${
                                    isKeyboardVisible ? 'max-h-[260px] pb-4 pt-3 px-2 opacity-100' : 'max-h-0 p-0 opacity-0 border-transparent'

                                                <div key={rowIndex} className="flex justify-center space-x-1.5">
                                                    {row.map(key => (
                                                        <button
                                                            key={key}
                                                            onClick={() => handleKeyPress(key)}
                                                            className={`h-11 flex-1 rounded-xl shadow-xs active:scale-95 transition-all flex items-center justify-center text-lg font-bold ${
                                                                key === 'ENTER'
                                                                    ? 'bg-orange-500 text-white'
                                                                    : key === 'DEL'
                                                                        ? 'bg-gray-300 text-gray-700 text-sm'
                                                                        : 'bg-white text-gray-800'
                                                            }`}
                                                        >
                                                            {key === 'DEL' ? <Delete size={18} /> : key === 'ENTER' ? 'Go' : key}
                                                        </button>
                                                    ))}
                                                </div>
                                            ))}
                                        </div>
                                    ) : (
                                        <div className="flex flex-col space-y-1.5">
                                            {qwertyRows.map((row, rowIndex) => (

                                                                        ? 'bg-gray-300 text-gray-700'
                                                                        : 'bg-white text-gray-800'
                                                            }`}

                                                            {key === 'DEL' ? <Delete size={16} /> : key === 'ENTER' ? 'Search' : key === 'SPACE' ? 'Space' : key}
                                                        </button>
                                                    ))}

                                            ))}
                                        </div>

                            </div>
                        </div>
                    </div>

            // =========================================================================
            const renderItemScanned = () => {

                const getStockColor = (status) => {
                    if (status === 'High Stock') return 'bg-green-50 text-green-700 border-green-200';
                    if (status === 'Moderate Stock') return 'bg-yellow-50 text-yellow-700 border-yellow-200';
                    return 'bg-red-50 text-red-700 border-red-200';
                };

                return (
                    <div className={`flex flex-col flex-1 min-h-0 ${theme.bg} p-5 justify-center overflow-y-auto`}>
                        <div className={`bg-white p-6 rounded-[2rem] shadow-xl ${theme.shadow} border ${theme.softBg} flex flex-col items-center relative`}>
                            <button
                                onClick={() => setScreen(scanOrigin)}
                                className="absolute top-4 right-4 p-2 text-gray-400 hover:text-gray-600 hover:bg-gray-100 rounded-full transition-colors"
                            >
                                <X size={22} />
                            </button>

                            <div className="flex items-center space-x-2 mb-4">
                                <span className={`px-3 py-1 rounded-full text-xs font-bold border ${getStockColor(scannedItem.stock)}`}>
                                    {scannedItem.stock}
                                </span>
                                <span className="px-3 py-1 rounded-full text-xs font-bold bg-orange-50 text-orange-700 border border-orange-200">
                                    {scannedItem.category}
                                </span>
                            </div>

                            <h2 className="text-xl font-bold text-center mb-3 text-gray-800 leading-snug px-4">
                                {scannedItem.name}
                            </h2>

                            <div className={`${theme.iconBg} border ${theme.borderHighlight} px-5 py-2 rounded-2xl mb-5`}>
                                <p className={`text-3xl font-black ${theme.textValue}`}>
                                    ₱{formatNumberWithCommas(scannedItem.price.toFixed(2))}
                                </p>
                            </div>

                            {/* Quantity Selector */}
                            <div className="flex items-center justify-between w-full max-w-[210px] bg-gray-50 rounded-2xl p-1.5 mb-5 border border-gray-100">
                                <button
                                    onClick={() => setItemQty(Math.max(1, itemQty - 1))}
                                    className="w-11 h-11 bg-white rounded-xl shadow-xs border border-gray-100 flex items-center justify-center text-gray-600 active:scale-95"
                                >
                                    <Minus size={20} />

                                <button
                                    onClick={() => {

                                >
                                    {itemQty}
                                </button>
                                <button
                                    onClick={() => setItemQty(itemQty + 1)}
                                    className="w-11 h-11 bg-white rounded-xl shadow-xs border border-gray-100 flex items-center justify-center text-gray-600 active:scale-95"
                                >
                                    <Plus size={20} />
                                </button>
                            </div>

                            <div className="w-full flex justify-between items-center mb-5 px-2 text-gray-500 font-bold text-base border-t border-dashed border-gray-200 pt-4">
                                <span>Subtotal:</span>
                                <span className={`text-xl ${theme.textValue} font-black ${theme.softBg} border ${theme.borderHighlight} px-3 py-1 rounded-xl`}>
                                    ₱{formatNumberWithCommas((scannedItem.price * itemQty).toFixed(2))}
                                </span>
                            </div>

                            <button
                                onClick={handleAddToCart}
                                className={`w-full py-4 ${theme.primary} text-white rounded-2xl font-bold text-lg shadow-lg ${theme.shadow} ${theme.primaryHover} active:scale-95 transition-all`}
                            >
                                Add to Cart
                            </button>
                            <button
                                onClick={() => setScreen(scanOrigin)}
                                className="w-full py-3 bg-gray-50 text-gray-500 border border-gray-100 rounded-2xl font-bold text-sm hover:bg-gray-100 transition-colors mt-2.5"
                            >
                                Cancel
                            </button>
                        </div>
                    </div>
                );
            };

            // =========================================================================
            // SCREEN 8: YOUR CART
            // =========================================================================
            const renderCart = () => (
                <div className={`flex flex-col flex-1 min-h-0 ${theme.bg}`}>
                    <div className="px-5 pt-3 pb-2 shrink-0">
                        <div className="flex items-center mb-2">
                            <button
                                onClick={() => setScreen('scanning')}
                                className="p-2.5 bg-white rounded-full text-gray-600 shadow-xs border border-orange-100 mr-3"
                            >
                                <ArrowLeft size={20} />
                            </button>
                            <h2 className="text-xl font-bold text-gray-800">Your Cart</h2>
                        </div>

                        {budgetMode !== 'none' && (
                            <div className={`${theme.softBg} border ${theme.borderHighlight} px-4 py-3 rounded-2xl flex justify-between items-center`}>
                                <div>
                                    <p className={`text-[10px] ${theme.textValue} font-bold uppercase tracking-wider`}>Set Budget</p>
                                    <p className="text-lg font-black text-gray-800">
                                        ₱{formatNumberWithCommas(effectiveBudget.toFixed(2))}
                                    </p>
                                </div>
                                <div className="text-right">
                                    <p className="text-[10px] text-gray-500 font-bold uppercase tracking-wider">Remaining</p>
                                    <p className={`text-lg font-black ${effectiveBudget - cartTotal < 0 ? 'text-red-600' : 'text-emerald-600'}`}>
                                        ₱{formatNumberWithCommas((effectiveBudget - cartTotal).toFixed(2))}
                                    </p>
                                </div>
                            </div>
                        )}
                    </div>

                    <div className="flex-1 overflow-y-auto px-5 py-2 space-y-2.5">
                        {cart.length === 0 ? (
                            <div className={`h-full flex flex-col items-center justify-center ${theme.textValue} opacity-60`}>
                                <ShoppingCart size={54} className="mb-4" />
                                <p className="text-lg font-bold">Your cart is empty</p>
                            </div>
                        ) : (
                            cart.map((item) => (
                                <div key={item.id} className={`bg-white p-4 rounded-2xl shadow-xs border ${theme.softBg} flex flex-col space-y-2.5`}>
                                    <div className="flex justify-between items-start gap-2">
                                        <div className="min-w-0 flex-1">
                                            <h3 className="font-bold text-gray-800 text-sm leading-snug truncate">{item.name}</h3>
                                            <p className="text-[11px] font-semibold text-gray-400 mt-0.5">
                                                ₱{formatNumberWithCommas(item.price.toFixed(2))} each • {item.category}
                                            </p>
                                        </div>
                                        <button
                                            onClick={() => handleRemoveFromCart(item.id)}
                                            className="p-1.5 text-gray-400 hover:text-red-500 hover:bg-red-50 rounded-lg transition-colors shrink-0"
                                        >
                                            <Trash2 size={18} />
                                        </button>
                                    </div>

                                    <div className="flex items-center justify-between pt-1 border-t border-gray-100">
                                        <div className="flex items-center space-x-2 bg-gray-50 p-1 rounded-xl border border-gray-200">
                                            <button
                                                onClick={() => updateCartItemQty(item.id, -1)}
                                                className="w-7 h-7 bg-white rounded-lg shadow-2xs flex items-center justify-center text-gray-700 active:scale-90"
                                            >
                                                <Minus size={14} />
                                            </button>
                                            <button
                                                onClick={() => {
                                                    setEditingCartItemId(item.id);
                                                    setQtyInputStr(item.qty.toString());
                                                    setIsQtyPadVisible(true);
                                                }}
                                                className="px-2.5 text-sm font-black text-gray-800"
                                            >
                                                {item.qty}
                                            </button>
                                            <button
                                                onClick={() => updateCartItemQty(item.id, 1)}
                                                className="w-7 h-7 bg-white rounded-lg shadow-2xs flex items-center justify-center text-gray-700 active:scale-90"
                                            >
                                                <Plus size={14} />
                                            </button>
                                        </div>

                                        <div className={`${theme.iconBg} border ${theme.borderHighlight} px-3 py-1 rounded-xl`}>
                                            <p className={`font-black text-base ${theme.textValue}`}>
                                                ₱{formatNumberWithCommas((item.price * item.qty).toFixed(2))}
                                            </p>
                                        </div>
                                    </div>
                                </div>
                            ))
                        )}
                    </div>

                    <div className={`bg-white p-4 rounded-t-[2rem] shadow-[0_-10px_40px_rgba(0,0,0,0.05)] border-t ${theme.border} shrink-0`}>
                        <div className="flex justify-between items-baseline mb-3">
                            <span className="text-gray-500 font-bold text-sm">
                                Total ({cart.reduce((s, i) => s + i.qty, 0)} items)
                            </span>
                            <span className="text-2xl font-black text-gray-800">
                                ₱{formatNumberWithCommas(cartTotal.toFixed(2))}
                            </span>
                        </div>
                        <button
                            onClick={() => cart.length > 0 && setScreen('checkout')}
                            className={`w-full py-4 rounded-2xl font-bold text-lg transition-all shadow-lg ${
                                cart.length > 0
                                    ? `${theme.primary} text-white ${theme.primaryHover} ${theme.shadow}`
                                    : 'bg-gray-200 text-gray-400 cursor-not-allowed'
                            }`}
                        >
                            Lock & Finish
                        </button>
                    </div>
                </div>
            );

            // =========================================================================
            // SCREEN 9: FINISH UP
            // =========================================================================
            const renderCheckout = () => (
                <div className={`flex flex-col flex-1 min-h-0 ${defaultTheme.bg}`}>
                    <div className={`${defaultTheme.primary} pt-4 pb-5 px-5 shadow-md z-10 relative text-white rounded-b-[2rem] shrink-0`}>
                        <div className="grid grid-cols-3 items-center mb-4">
                            <div className="flex justify-start">
                                <button
                                    onClick={() => setScreen('scanning')}
                                    className="px-4 py-2 bg-white/20 hover:bg-white/30 active:scale-95 rounded-2xl text-white font-extrabold text-base flex items-center space-x-1.5 transition-all"
                                >
                                    <ArrowLeft size={20} />
                                    <span>Back</span>
                                </button>
                            </div>
                            <h2 className="text-xl font-black text-center tracking-wide">Finish Up</h2>
                            <div></div>
                        </div>

                        <p className="text-white/80 text-xs font-bold uppercase tracking-wider mb-1 text-center">
                            Total Bill to Pay
                        </p>
                        <h1 className="text-4xl font-black tracking-tight text-center truncate">
                            ₱{formatNumberWithCommas(cartTotal.toFixed(2))}
                        </h1>
                    </div>

                    <div className="flex-1 overflow-y-auto px-5 py-4">
                        <h3 className="font-bold text-gray-700 mb-3 flex items-center text-sm uppercase tracking-wider">
                            <ScanLine size={18} className="mr-2 text-orange-600" /> Final Item List
                        </h3>

                        <div className="bg-white rounded-2xl shadow-xs border border-orange-200 overflow-hidden">
                            {cart.length === 0 ? (
                                <p className="p-6 text-center text-sm font-semibold text-gray-400">No items scanned yet.</p>
                            ) : (
                                cart.map((item, index) => (
                                    <div key={index} className="p-4 border-b border-gray-100 flex justify-between items-center last:border-0">
                                        <div className="flex-1 pr-3 min-w-0">
                                            <h4 className="font-bold text-gray-800 text-sm truncate">{item.name}</h4>
                                            <p className="text-xs font-medium text-gray-500 mt-0.5">
                                                Qty: {item.qty} × ₱{formatNumberWithCommas(item.price.toFixed(2))}
                                            </p>
                                        </div>
                                        <div className="bg-orange-50 border border-orange-200 px-3 py-1 rounded-xl shrink-0">
                                            <p className="font-black text-orange-600 text-sm">
                                                ₱{formatNumberWithCommas((item.price * item.qty).toFixed(2))}
                                            </p>
                                        </div>
                                    </div>
                                ))
                            )}
                        </div>
                    </div>

                    <div className="bg-white p-4 rounded-t-[2rem] shadow-[0_-10px_40px_rgba(0,0,0,0.05)] border-t border-orange-100 shrink-0">
                        <button
                            onClick={() => setScreen('thank_you')}
                            className="w-full py-4 bg-orange-500 text-white rounded-2xl font-bold text-lg shadow-xl shadow-orange-200 hover:bg-orange-600 active:scale-95 transition-all flex items-center justify-center space-x-2"
                        >
                            <CheckCircle2 size={24} />
                            <span>Confirm & Exit</span>
                        </button>
                    </div>
                </div>
            );

            // =========================================================================
            // SCREEN 10: THANK YOU / ENDING
            // =========================================================================
            const renderThankYou = () => (
                <div className="flex flex-col h-full bg-[#FFF9F5] items-center justify-center px-8 text-center animate-in fade-in duration-500">
                    <div className="w-28 h-28 bg-white shadow-xl shadow-orange-200 border border-orange-200 rounded-full flex items-center justify-center mb-8">
                        <CheckCircle2 size={56} className="text-orange-500" />
                    </div>
                    <h2 className="text-3xl font-black mb-3 text-orange-950">Thank You!</h2>
                    <p className="text-gray-500 text-base mb-8 leading-relaxed">
                        Your shopping session is complete and all session data has been cleared.
                    </p>

                    <div className="bg-white px-5 py-3 rounded-2xl border border-orange-100 shadow-xs flex items-center space-x-2 text-gray-500">
                        <span className="w-2 h-2 rounded-full bg-orange-500 animate-ping"></span>
                        <p className="text-xs font-extrabold uppercase tracking-widest">
                            Returning to start in {thankYouSeconds}s
                        </p>
                    </div>
                </div>
            );

            // =========================================================================
            // POPUP OVERLAYS
            // =========================================================================
            const renderWarning70Popup = () => (
                <div className="absolute inset-0 bg-black/50 backdrop-blur-xs z-50 flex items-center justify-center p-5 animate-in fade-in duration-200">
                    <div className="bg-white p-6 rounded-[2rem] w-full max-w-xs flex flex-col items-center text-center shadow-2xl border-4 border-yellow-400">
                        <div className="w-16 h-16 bg-yellow-100 rounded-2xl flex items-center justify-center mb-4 border border-yellow-200">
                            <AlertCircle size={36} className="text-yellow-600" />
                        </div>
                        <h2 className="text-2xl font-black mb-2 text-gray-800">Budget Alert!</h2>
                        <p className="text-gray-600 text-sm mb-6 leading-relaxed font-medium">
                            {alertMessage || 'You have reached 70% of your budget. Spend wisely!'}
                        </p>
                        <button
                            onClick={() => setPopupAlert(null)}
                            className="w-full py-3.5 bg-yellow-500 text-white rounded-2xl font-bold text-base shadow-md hover:bg-yellow-600 active:scale-95 transition-all"
                        >
                            Close
                        </button>
                    </div>
                </div>
            );

            const renderBudgetAlertPopup = () => (
                <div className="absolute inset-0 bg-black/60 backdrop-blur-xs z-50 flex items-center justify-center p-5 animate-in fade-in duration-200">
                    <div className="bg-white p-5 rounded-[2rem] w-full max-w-xs flex flex-col items-center text-center shadow-2xl border-4 border-red-500">
                        <div className="w-14 h-14 bg-red-100 rounded-2xl flex items-center justify-center mb-3 border border-red-200">
                            <AlertCircle size={32} className="text-red-500" />
                        </div>
                        <h2 className="text-xl font-black mb-1 text-gray-800">Budget Limit Reached!</h2>
                        <p className="text-gray-500 text-xs mb-4">
                            Adding this item exceeds your total budget of{' '}
                            <span className="font-bold text-red-600">
                                ₱{formatNumberWithCommas(effectiveBudget.toFixed(2))}
                            </span>
                        </p>

                        <div className="bg-red-50 border border-red-100 p-3 rounded-2xl w-full mb-4 text-xs">
                            <div className="flex justify-between mb-1 text-gray-600">
                                <span>Current Total:</span>
                                <span className="font-bold text-gray-800">₱{formatNumberWithCommas(cartTotal.toFixed(2))}</span>
                            </div>
                            <div className="flex justify-between mb-1 text-gray-600">
                                <span>Item to Add:</span>
                                <span className="font-bold text-gray-800">₱{formatNumberWithCommas(((scannedItem?.price || 0) * itemQty).toFixed(2))}</span>
                            </div>
                            <div className="h-px bg-red-200 my-1.5"></div>
                            <div className="flex justify-between text-sm font-black text-red-600">
                                <span>New Total:</span>
                                <span>₱{formatNumberWithCommas((cartTotal + ((scannedItem?.price || 0) * itemQty)).toFixed(2))}</span>
                            </div>
                        </div>

                        <div className="space-y-2 w-full">
                            {budgetMode === 'single' && (
                                <button
                                    onClick={() => {
                                        setPopupAlert(null);
                                        setReturnScreen('item_scanned');
                                        setScreen('budget_input');
                                    }}
                                    className="w-full py-3 bg-white text-red-600 border border-red-200 rounded-xl font-bold text-xs hover:bg-red-50"
                                >
                                    Edit Budget Amount
                                </button>
                            )}
                            <button
                                onClick={() => {
                                    setPopupAlert(null);
                                    setScreen('cart');
                                }}
                                className="w-full py-3 bg-gray-100 text-gray-700 border border-gray-200 rounded-xl font-bold text-xs hover:bg-gray-200"
                            >
                                Go to Cart to Adjust
                            </button>
                            <button
                                onClick={() => {
                                    addToCartState(scannedItem, itemQty);
                                    setPopupAlert(null);
                                    setScreen('checkout');
                                }}
                                className="w-full py-3 bg-red-500 text-white rounded-xl font-bold text-xs shadow-md hover:bg-red-600"
                            >
                                Add Anyway & Finish Up
                            </button>
                            <button
                                onClick={() => {
                                    setPopupAlert(null);
                                    setScreen(scanOrigin);
                                }}
                                className="w-full py-2 text-gray-500 font-bold text-xs hover:bg-gray-50 rounded-xl"
                            >
                                Cancel Item
                            </button>
                        </div>
                    </div>
                </div>
            );

            const renderQtyPadPopup = () => {
                const numKeys = [
                    ['1', '2', '3'],
                    ['4', '5', '6'],
                    ['7', '8', '9'],
                    ['DEL', '0', 'OK']
                ];

                const handleKey = (key) => {
                    if (key === 'DEL') {
                        setQtyInputStr(prev => (prev.length > 1 ? prev.slice(0, -1) : '0'));
                    } else if (key === 'OK') {
                        const num = Math.max(1, parseInt(qtyInputStr || '1', 10));
                        if (editingCartItemId) {
                            setCart(prev => prev.map(item => item.id === editingCartItemId ? { ...item, qty: num } : item));
                            setEditingCartItemId(null);
                        } else {
                            setItemQty(num);
                        }
                        setIsQtyPadVisible(false);
                    } else {
                        setQtyInputStr(prev => {
                            if (prev === '0') return key;
                            if (prev.length >= 3) return prev;
                            return prev + key;
                        });
                    }
                };

                const adjustStr = (delta) => {
                    const num = parseInt(qtyInputStr || '1', 10);
                    setQtyInputStr(Math.max(1, num + delta).toString());
                };

                return (
                    <div className="absolute inset-0 bg-black/60 backdrop-blur-xs z-50 flex items-center justify-center p-5 animate-in fade-in duration-200">
                        <div className={`bg-white p-5 rounded-[2rem] w-full max-w-xs flex flex-col shadow-2xl border-4 ${theme.borderHighlight}`}>
                            <h3 className="text-center font-bold text-gray-400 mb-4 uppercase tracking-wider text-xs">
                                Set Quantity
                            </h3>

                            <div className="flex items-center justify-center space-x-5 mb-5">
                                <button
                                    onClick={() => adjustStr(-1)}
                                    className={`p-3 ${theme.softBg} ${theme.textValue} rounded-xl active:scale-95`}
                                >
                                    <ChevronDown size={24} strokeWidth={3} />
                                </button>
                                <div className="text-4xl font-black w-20 text-center text-gray-800">{qtyInputStr || '1'}</div>
                                <button
                                    onClick={() => adjustStr(1)}
                                    className={`p-3 ${theme.softBg} ${theme.textValue} rounded-xl active:scale-95`}
                                >
                                    <ChevronUp size={24} strokeWidth={3} />
                                </button>
                            </div>

                            <div className="flex flex-col space-y-2">
                                {numKeys.map((row, i) => (
                                    <div key={i} className="flex space-x-2">
                                        {row.map(key => (
                                            <button
                                                key={key}
                                                onClick={() => handleKey(key)}
                                                className={`h-12 flex-1 rounded-xl font-bold text-lg border border-gray-100 active:scale-95 transition-all flex items-center justify-center ${
                                                    key === 'DEL'
                                                        ? 'bg-gray-100 text-gray-600'
                                                        : key === 'OK'
                                                            ? `${theme.primary} text-white`
                                                            : 'bg-white text-gray-800 hover:bg-orange-50'
                                                }`}
                                            >
                                                {key === 'DEL' ? <Delete size={20} /> : key === 'OK' ? <CheckCircle2 size={22} /> : key}
                                            </button>
                                        ))}
                                    </div>
                                ))}
                            </div>
                        </div>
                    </div>
                );
            };

            // =========================================================================
            // MAIN KIOSK / MONITOR SHELL RENDERER
            // =========================================================================
            return (
                <div className="min-h-screen bg-neutral-200 py-4 sm:py-8 flex items-center justify-center font-sans px-3">
                    <div className="w-full max-w-[480px] h-[760px] max-h-[94vh] bg-white rounded-[2.5rem] shadow-2xl shadow-neutral-400 border-[14px] border-[#1c1c1e] relative overflow-hidden flex flex-col">

                        {/* Persistent Header on all screens except startup & ending */}
                        {showPersistentHeader && <TopHeader />}

                        {/* Screen Router */}
                        {screen === 'splash1' && renderSplash1()}
                        {screen === 'privacy_consent' && renderPrivacyConsent()}
                        {screen === 'tutorial' && renderTutorial()}
                        {screen === 'budget_prompt' && renderBudgetPrompt()}
                        {screen === 'budget_input' && renderBudgetInput()}
                        {screen === 'allocation_setup' && renderAllocationSetup()}
                        {screen === 'allocation_select_category' && renderAllocationSelectCategory()}
                        {screen === 'scanning' && renderScanning()}
                        {screen === 'manual_input' && renderManualInput()}
                        {screen === 'item_scanned' && renderItemScanned()}
                        {screen === 'cart' && renderCart()}
                        {screen === 'checkout' && renderCheckout()}
                        {screen === 'thank_you' && renderThankYou()}

                        {/* Global Overlay Modals */}
                        {popupAlert === 'warning70' && renderWarning70Popup()}
                        {popupAlert === 'limit' && renderBudgetAlertPopup()}
                        {isQtyPadVisible && renderQtyPadPopup()}

                    </div>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
