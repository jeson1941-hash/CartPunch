<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CartPunch Admin Login</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        brand: {
                            500: '#ef6c00',
                            600: '#e65100',
                        },
                        surface: '#f8fafc',
                    }
                }
            }
        }
    </script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>

    <!-- Firebase SDKs -->
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>

    <!-- EmailJS SDK -->
    <script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/email.min.js"></script>

    <style>
        body {
            font-family: 'Inter', sans-serif;
        }

        .animate-fade-in {
            animation: fadeIn 0.4s ease-out;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(10px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
    </style>
</head>

<body class="bg-surface h-screen flex items-center justify-center text-slate-800">

    <div class="w-full max-w-md p-8 bg-white rounded-2xl shadow-xl border border-slate-100 animate-fade-in">
        <div class="flex flex-col items-center mb-8">
            <div
                class="w-16 h-16 bg-brand-500 rounded-2xl flex items-center justify-center text-white mb-4 shadow-lg shadow-brand-500/30">
                <i data-lucide="scan-line" class="w-8 h-8"></i>
            </div>
            <h1 class="text-2xl font-extrabold text-slate-800 tracking-tight">CartPunch Admin</h1>
            <p id="login-subtitle" class="text-sm text-slate-500 mt-1 text-center">Please sign in to access the
                dashboard</p>
        </div>

        <!-- Shared Status / Error Banner -->
        <div id="error-message"
            class="hidden mb-5 bg-rose-50 text-rose-600 text-sm font-semibold p-4 rounded-lg border border-rose-100 flex items-center space-x-2">
            <i data-lucide="alert-circle" class="w-4 h-4 shrink-0"></i>
            <span id="error-text">Invalid credentials</span>
        </div>

        <!-- Step 1: Email & Password Form -->
        <form id="login-form" class="space-y-5">
            <div>
                <label class="block text-xs font-bold text-slate-500 uppercase tracking-wider mb-2">Email</label>
                <div class="relative">
                    <i data-lucide="mail" class="w-5 h-5 absolute left-3 top-1/2 -translate-y-1/2 text-slate-400"></i>
                    <input type="email" id="email" required placeholder="admin@cartpunch.com"
                        class="w-full pl-10 pr-4 py-3 bg-slate-50 border border-slate-200 rounded-lg text-slate-800 focus:outline-none focus:border-brand-500 focus:ring-1 focus:ring-brand-500 transition-all">
                </div>
            </div>
            <div>
                <label class="block text-xs font-bold text-slate-500 uppercase tracking-wider mb-2">Password</label>
                <div class="relative">
                    <i data-lucide="lock" class="w-5 h-5 absolute left-3 top-1/2 -translate-y-1/2 text-slate-400"></i>
                    <input type="password" id="password" required placeholder="••••••••"
                        class="w-full pl-10 pr-12 py-3 bg-slate-50 border border-slate-200 rounded-lg text-slate-800 focus:outline-none focus:border-brand-500 focus:ring-1 focus:ring-brand-500 transition-all">
                    <button type="button" onclick="togglePassword()"
                        class="absolute right-3 top-1/2 -translate-y-1/2 text-slate-400 hover:text-slate-600 focus:outline-none">
                        <i data-lucide="eye" id="eye-icon" class="w-5 h-5"></i>
                    </button>
                </div>
            </div>

            <button type="submit" id="login-btn"
                class="w-full py-3.5 bg-brand-500 hover:bg-brand-600 text-white font-bold rounded-lg shadow-md shadow-brand-500/20 transition-all mt-6 flex justify-center items-center space-x-2">
                <span id="login-btn-text">Sign In</span>
                <i data-lucide="arrow-right" class="w-4 h-4"></i>
            </button>
        </form>

        <!-- Step 2: 2FA OTP Verification Form (Hidden until password succeeds) -->
        <div id="otp-section" class="hidden space-y-5">
            <div
                class="bg-amber-50 border border-amber-200 rounded-lg p-3.5 text-xs text-amber-800 flex items-start space-x-2.5">
                <i data-lucide="shield-check" class="w-4 h-4 text-amber-600 shrink-0 mt-0.5"></i>
                <span id="otp-info">We sent a 6-digit verification code to your email. It expires in 5 minutes.</span>
            </div>

            <div>
                <label class="block text-xs font-bold text-slate-500 uppercase tracking-wider mb-2">6-Digit Verification
                    Code</label>
                <input type="text" id="otp-input" maxlength="6" inputmode="numeric" placeholder="000000"
                    class="w-full py-3.5 px-4 bg-slate-50 border border-slate-200 rounded-lg text-slate-800 text-center text-2xl font-extrabold tracking-[0.4em] focus:outline-none focus:border-brand-500 focus:ring-1 focus:ring-brand-500 transition-all">
            </div>

            <button type="button" id="verify-otp-btn"
                class="w-full py-3.5 bg-brand-500 hover:bg-brand-600 text-white font-bold rounded-lg shadow-md shadow-brand-500/20 transition-all flex justify-center items-center space-x-2">
                <span id="verify-btn-text">Verify &amp; Access Dashboard</span>
                <i data-lucide="check-circle" class="w-4 h-4"></i>
            </button>

            <div class="flex items-center justify-between pt-2 text-xs">
                <button type="button" id="back-to-login-btn" class="text-slate-400 hover:text-slate-600 font-semibold">
                    &larr; Back to login
                </button>
                <button type="button" id="resend-otp-btn" class="text-brand-500 hover:text-brand-600 font-bold">
                    Resend Code
                </button>
            </div>
        </div>
    </div>

    <script src="scripts/login.js"></script>
</body>

</html>
